name: Build and Release Extension

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: github.event.pull_request.merged == true

    outputs:
      TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies with Yarn
        run: yarn install --frozen-lockfile

      - name: Quality gate
        run: |
          yarn typecheck
          yarn lint
          yarn test

      - name: Build and zip all targets
        run: |
          yarn zip
          yarn zip:firefox
          yarn zip:opera

      - name: Get extension version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: Release ${{ steps.version.outputs.TAG_NAME }}
          files: .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build-and-release
    if: github.event.pull_request.merged == true
    steps:
      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-zips

      - name: Resolve chrome zip path
        id: zip
        run: echo "file=$(ls *-chrome.zip .output/*-chrome.zip 2>/dev/null | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.zip.outputs.file }}
          extension-id: "lnhfadikffnjjhmoimkeinbbhcnkkcln"
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true

  publish-firefox:
    name: Publish to Firefox Add-ons
    runs-on: ubuntu-latest
    needs: build-and-release
    if: github.event.pull_request.merged == true
    # Does not block the release if AMO credentials are not configured yet.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies with Yarn
        run: yarn install --frozen-lockfile

      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "Firefox AMO credentials not set. Skipping."
            exit 0
          fi
          yarn zip:firefox
          npx wxt submit \
            --firefox-zip "$(ls .output/*-firefox.zip | head -n1)" \
            --firefox-sources-zip "$(ls .output/*-sources.zip | head -n1)"
